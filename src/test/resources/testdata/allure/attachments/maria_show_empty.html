<html title="test title">
<head>
<style>
                    table {
                        width: 100%;
                        margin-bottom: 1rem;
                        color: #111314;
                        border-collapse: collapse;
                        font-size: 12;
                    }
                    table td, table th {
                        vertical-align: center;
                        text-align:center;
                        border: 1px solid #dee2e6;
                    }
                    tr:nth-of-type(even) {
                        background-color:#faf7eb;
                    }
                    tr:nth-of-type(odd) {
                        background-color:#f0faf4;
                    }
                    table th{
                        position: sticky;
                        top: 0;
                        background-color:#FBFCFC!important;
                    }
                    #stick-column {
                        position: sticky;
                        left: 0;
                        font-weight: bold;
                    }
</style>
</head>
<body>
<table>
<tr>
<th>ID</th><th>DEPOSIT</th><th>USERNAME</th><th>PASSWORD</th><th>EMAIL</th><th>STATE</th><th>DESCRIPTION</th><th>ROLES</th><th>DATA</th><th>IS_ACTIVE</th><th>CREATE_DATE</th><th>UPDATE_DATE</th></tr>
</table>
</body>
</html>
