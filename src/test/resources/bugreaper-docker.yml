modules:
  db:
    custom-db:
      url: 'jdbc:clickhouse://docker:8123/MYSCHEMA'
      username: default
      password: password
      await: 420 # optional
      enchanted-report: true # optional
    custom-db-2:
      url: 'jdbc:clickhouse://docker:8123/MYSCHEMA'
      username: default
      password: password
      await: 200 # optional
      enchanted-report: false # optional
    custom-db-3:
      url: 'jdbc:clickhouse://docker:8123/MYSCHEMA'
      username: default
      password: password
      await: 400 # optional
      enchanted-report: true # optional
    mariadb:
      url: 'jdbc:mariadb://docker:3307'
      username: test_user
      password: secret_pass
      await: 510 # optional
      await-poll-interval: 200 # optional
      enchanted-report: true # optional
    mysql:
      url: 'jdbc:mysql://docker:3308'
      username: mysql_user
      password: mysql_pass
      #await: 600 # optional
    postgresql:
      url: 'jdbc:postgresql://docker:5432/public?options=-c%20timezone=Europe/Kyiv'
      username: postgres
      password: postgres
      await: 200 # optional
    sqlserver:
      url: 'jdbc:sqlserver://docker:1435;encrypt=false'
      username: sa
      password: YourStrong(!)Password
      await: 250 # optional
      await-poll-interval: 70 # optional
    oracle:
      url: 'jdbc:oracle:thin:@docker:1521/xepdb1'
      username: ADMIN
      password: ADMIN
      await: 300 # optional
