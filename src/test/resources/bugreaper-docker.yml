modules:
  db:
    custom-db:
      url: 'jdbc:clickhouse://docker:8123/MYSCHEMA'
      username: default
      password: password
      await: 420 # optional
      enchanted-report: true # optional
    custom-db-2:
      url: 'jdbc:clickhouse://docker:8123/MYSCHEMA'
      username: default
      password: password
      await: 200 # optional
      enchanted-report: false # optional
    custom-db-3:
      url: 'jdbc:clickhouse://docker:8123/MYSCHEMA?connection_timeout=5500'
      username: default
      password: password
      await: 400 # optional
      enchanted-report: true # optional
      template-dir: templates/custom-db/ # optional
      hikari: # optional
        readOnly: true
        leakDetectionThreshold: 2000

    mariadb:
      url: 'jdbc:mariadb://docker:3307?connectTimeout=5001'
      username: test_user
      password: secret_pass
      await: 510 # optional
      await-poll-interval: 200 # optional
      enchanted-report: true # optional

      # JDBC driver configuration
      properties: # optional
        connectTimeout: 3001
        socketTimeout: 3002

      # Hikari configuration
      hikari: # optional
        poolName: mariadb-pool
        minimumIdle: 2
        maximumPoolSize: 4
        maxLifetime: 600000
        keepAliveTime: 110000
        connectionTimeout: 10000
        validationTimeout: 9000
        idleTimeout: 10555
        leakDetectionThreshold: 0
        readOnly: false


    mysql:
      url: 'jdbc:mysql://docker:3308'
      username: mysql_user
      password: mysql_pass
      #await: 600 # optional
    postgresql:
      url: 'jdbc:postgresql://docker:5432/public?options=-c%20timezone=Europe/Kyiv'
      username: postgres
      password: postgres
      await: 200 # optional
    sqlserver:
      url: 'jdbc:sqlserver://docker:1435;encrypt=false'
      username: sa
      password: YourStrong(!)Password
      await: 250 # optional
      await-poll-interval: 70 # optional
    oracle:
      url: 'jdbc:oracle:thin:@docker:1521/xepdb1'
      username: ADMIN
      password: ADMIN
      await: 300 # optional
      properties: # optional
        connectTimeout: 3002

